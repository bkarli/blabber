name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches tauri.conf.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CONF_VERSION=$(grep '"version"' blabber-app/src-tauri/tauri.conf.json | head -1 | sed -E 's/.*"version": *"([^"]+)".*/\1/')
          if [ "$TAG_VERSION" != "$CONF_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) doesn't match tauri.conf.json version ($CONF_VERSION)"
            exit 1
          fi

  build:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target-key: linux-x86_64
            bundle-glob: 'src-tauri/target/release/bundle/appimage/*.AppImage*'
          - platform: windows-latest
            target-key: windows-x86_64
            bundle-glob: 'src-tauri/target/release/bundle/nsis/*'
          - platform: macos-latest
            target-key: darwin-x86_64
            bundle-glob: 'src-tauri/target/release/bundle/macos/*'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev librsvg2-dev patchelf

      - name: Install frontend deps
        run: npm ci
        working-directory: blabber-app

      - name: Build and sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build
        working-directory: blabber-app

      - name: Publish bundles to update server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          VERSION="${GITHUB_REF_NAME#v}"

          ssh -p 12345 -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no deploy@updates.b3ni.net \
            "mkdir -p /srv/blabber-updates/releases/$VERSION"

          rsync -avz \
            -e "ssh -p 12345 -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            blabber-app/${{ matrix.bundle-glob }} \
            deploy@updates.b3ni.net:/srv/blabber-updates/releases/$VERSION/

      - name: Save signature for manifest job
        shell: bash
        run: |
          mkdir -p signatures
          find blabber-app/src-tauri/target/release/bundle -name '*.sig' -exec cp {} signatures/${{ matrix.target-key }}.sig \;

      - uses: actions/upload-artifact@v4
        with:
          name: signature-${{ matrix.target-key }}
          path: signatures/${{ matrix.target-key }}.sig

  publish-manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: signatures
          pattern: signature-*
          merge-multiple: false

      - name: Build latest.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          LINUX_SIG=$(cat signatures/signature-linux-x86_64/linux-x86_64.sig)
          WINDOWS_SIG=$(cat signatures/signature-windows-x86_64/windows-x86_64.sig)
          DARWIN_SIG=$(cat signatures/signature-darwin-x86_64/darwin-x86_64.sig)

          cat > latest.json <<EOF
          {
            "version": "$VERSION",
            "pub_date": "$PUB_DATE",
            "platforms": {
              "linux-x86_64": {
                "signature": "$LINUX_SIG",
                "url": "https://updates.b3ni.net/releases/$VERSION/blabber-app_${VERSION}_amd64.AppImage"
              },
              "windows-x86_64": {
                "signature": "$WINDOWS_SIG",
                "url": "https://updates.b3ni.net/releases/$VERSION/blabber-app_${VERSION}_x64-setup.exe"
              },
              "darwin-x86_64": {
                "signature": "$DARWIN_SIG",
                "url": "https://updates.b3ni.net/releases/$VERSION/blabber-app_${VERSION}_x64.app.tar.gz"
              }
            }
          }
          EOF

      - name: Publish manifest
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          scp -P 12345 -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            latest.json deploy@updates.b3ni.net:/srv/blabber-updates/latest.json
