[package]
name = "blabber-core"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = { workspace = true, features = ["zeroize"] }
chacha20poly1305 = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
blake3 = { workspace = true }
anyhow = { workspace = true }
cpal = { version = "0.15", optional = true }
symphonia = { version = "0.5", features = ["mp3"], optional = true }

uuid = { workspace = true, features= ["v4", "serde"]}

iroh = { workspace = true, features = ["tls-ring"] }
iroh-docs = { workspace = true, default-features = false, features = ["fs-store"] }
iroh-blobs = { workspace = true, default-features = false, features = ["fs-store"] }
iroh-gossip = { workspace = true, default-features = false, features = ["net"] }
postcard = { workspace = true }
serde = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

n0-future = { workspace = true }
data-encoding = { workspace = true }
memsec = "0.7.0"

base64 = { workspace = true }

[features]
default = ["audio"]
audio = ["dep:cpal", "dep:symphonia"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3.27.0"
