[package]
name = "blabber-core"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = { workspace = true }
chacha20poly1305 = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
anyhow = { workspace = true }
